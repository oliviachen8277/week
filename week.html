<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一星期有七天 | Les 7 jours de la semaine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-sky-50 min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-sky-200 p-8">
        <!-- 標題區 -->
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-sky-800">🚂 一星期有七天 🚂</h1>
            <p class="text-sky-600 text-xl font-medium mt-2">Les 7 jours de la semaine</p>
        </header>

        <!-- 展示當前點擊特寫卡片 -->
        <div id="detail-card" class="bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-3xl p-8 text-center shadow-lg transition-all duration-300">
            <div id="card-emoji" class="text-8xl mb-4 animate-bounce">🎒</div>
            <h2 id="card-day-fr" class="text-5xl font-bold tracking-wide">Lundi</h2>
            <h3 id="card-day-zh" class="text-3xl font-semibold text-orange-100 mb-6">星期一</h3>
            <div id="card-activity" class="bg-white/20 backdrop-blur-md rounded-2xl p-5 text-xl font-medium">
                🎒 今天是上學日！準備包包去學校囉！<br>
                <span id="card-activity-fr" class="text-base text-orange-100">C'est un jour d'école ! On va à l'école.</span>
            </div>
        </div>

        <!-- 7 天按鈕區（車廂排版） -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
            <button onclick="showDay(0)" class="bg-amber-100 hover:bg-amber-200 active:scale-95 border-2 border-amber-300 p-4 rounded-2xl flex flex-col items-center cursor-pointer transition-all shadow-sm">
                <span class="text-4xl">🎒</span>
                <span class="font-bold text-amber-800 text-xl mt-1">Lundi</span>
                <span class="text-lg text-amber-600 font-medium">星期一</span>
            </button>
            <button onclick="showDay(1)" class="bg-amber-100 hover:bg-amber-200 active:scale-95 border-2 border-amber-300 p-4 rounded-2xl flex flex-col items-center cursor-pointer transition-all shadow-sm">
                <span class="text-4xl">🎒</span>
                <span class="font-bold text-amber-800 text-xl mt-1">Mardi</span>
                <span class="text-lg text-amber-600 font-medium">星期二</span>
            </button>
            <button onclick="showDay(2)" class="bg-emerald-100 hover:bg-emerald-200 active:scale-95 border-2 border-emerald-300 p-4 rounded-2xl flex flex-col items-center cursor-pointer transition-all shadow-sm">
                <span class="text-4xl">🎾</span>
                <span class="font-bold text-emerald-800 text-xl mt-1">Mercredi</span>
                <span class="text-lg text-emerald-600 font-medium">星期三 (網球)</span>
            </button>
            <button onclick="showDay(3)" class="bg-amber-100 hover:bg-amber-200 active:scale-95 border-2 border-amber-300 p-4 rounded-2xl flex flex-col items-center cursor-pointer transition-all shadow-sm">
                <span class="text-4xl">🎒</span>
                <span class="font-bold text-amber-800 text-xl mt-1">Jeudi</span>
                <span class="text-lg text-amber-600 font-medium">星期四</span>
            </button>
            <button onclick="showDay(4)" class="bg-amber-100 hover:bg-amber-200 active:scale-95 border-2 border-amber-300 p-4 rounded-2xl flex flex-col items-center cursor-pointer transition-all shadow-sm">
                <span class="text-4xl">🎒</span>
                <span class="font-bold text-amber-800 text-xl mt-1">Vendredi</span>
                <span class="text-lg text-amber-600 font-medium">星期五</span>
            </button>
            <button onclick="showDay(5)" class="bg-purple-100 hover:bg-purple-200 active:scale-95 border-2 border-purple-300 p-4 rounded-2xl flex flex-col items-center cursor-pointer transition-all shadow-sm">
                <span class="text-4xl">🐎</span>
                <span class="font-bold text-purple-800 text-xl mt-1">Samedi</span>
                <span class="text-lg text-purple-600 font-medium">星期六</span>
            </button>
            <button onclick="showDay(6)" class="bg-pink-100 hover:bg-pink-200 active:scale-95 border-2 border-pink-300 p-4 rounded-2xl flex flex-col items-center cursor-pointer transition-all shadow-sm col-span-2 md:col-span-1">
                <span class="text-4xl">🍦</span>
                <span class="font-bold text-pink-800 text-xl mt-1">Dimanche</span>
                <span class="text-lg text-pink-600 font-medium">星期日</span>
            </button>
        </div>

        <p class="text-center text-gray-500 text-lg mt-6">💡 點選按鈕看看今天要做什麼事！</p>
    </div>

    <script>
        const days = [
            { fr: "Lundi", zh: "星期一", emoji: "🎒", desc: "🎒 今天是上學日！準備包包去學校囉！", descFr: "C'est un jour d'école ! On va à l'école.", color: "from-amber-500 to-amber-600", textColor: "text-amber-100" },
            { fr: "Mardi", zh: "星期二", emoji: "🎒", desc: "🎒 今天是上學日！加油加油！", descFr: "C'est un jour d'école ! Courage !", color: "from-amber-500 to-amber-600", textColor: "text-amber-100" },
            { fr: "Mercredi", zh: "星期三", emoji: "🎾", desc: "🎾 今天去打網球！動一動好健康！", descFr: "Aujourd'hui, c'est le tennis !", color: "from-emerald-500 to-emerald-600", textColor: "text-emerald-100" },
            { fr: "Jeudi", zh: "星期四", emoji: "🎒", desc: "🎒 今天是上學日！認真上課喔！", descFr: "C'est un jour d'école ! Soyez attentif !", color: "from-amber-500 to-amber-600", textColor: "text-amber-100" },
            { fr: "Vendredi", zh: "星期五", emoji: "🎒", desc: "🎒 今天是上學日！明天就要放假囉！", descFr: "C'est vendredi ! Le week-end arrive !", color: "from-amber-500 to-amber-600", textColor: "text-amber-100" },
            { fr: "Samedi", zh: "星期六", emoji: "🐎", desc: "🐎 今天去騎馬！太開心了！", descFr: "Aujourd'hui, on fait de l'équitation !", color: "from-purple-500 to-purple-600", textColor: "text-purple-100" },
            { fr: "Dimanche", zh: "星期日", emoji: "🍦", desc: "🍦 快樂星期天！一起吃冰淇淋休息吧！", descFr: "Bon dimanche ! On se repose et on mange une glace !", color: "from-pink-500 to-pink-600", textColor: "text-pink-100" }
        ];

        function showDay(index) {
            const day = days[index];
            const card = document.getElementById('detail-card');
            
            // 更新卡片外觀與文字內容
            document.getElementById('card-emoji').innerText = day.emoji;
            document.getElementById('card-day-fr').innerText = day.fr;
            document.getElementById('card-day-zh').innerText = day.zh;
            document.getElementById('card-day-zh').className = `text-3xl font-semibold mb-6 ${day.textColor}`;
            
            const activityBox = document.getElementById('card-activity');
            activityBox.innerHTML = `${day.desc}<br><span class="text-base ${day.textColor}">${day.descFr}</span>`;
            
            // 更換漸層背景色
            card.className = `bg-gradient-to-br ${day.color} text-white rounded-3xl p-8 text-center shadow-lg transition-all duration-300`;
        }
    </script>
</body>
</html>
